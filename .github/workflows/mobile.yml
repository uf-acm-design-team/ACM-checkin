name: Mobile CI

# Lint, typecheck and test the Expo app on every PR that could affect it.
# Besides mobile/, these web files are included because mobile depends on them:
# - app/globals.css: the theme test checks mobile tokens against it
# - lib/checkin-link.ts: the QR parser test round-trips web's link builder
# - supabase/functions/member-check-in/contract.ts (+ the lib/ types it uses):
#   the check-in screen is typed against it
on:
  pull_request:
    paths:
      - "mobile/**"
      - "app/globals.css"
      - "lib/checkin-link.ts"
      - "lib/form-schema.ts"
      - "lib/geo.ts"
      - "supabase/functions/member-check-in/contract.ts"
      - ".github/workflows/mobile.yml"
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "app/globals.css"
      - "lib/checkin-link.ts"
      - "lib/form-schema.ts"
      - "lib/geo.ts"
      - "supabase/functions/member-check-in/contract.ts"
      - ".github/workflows/mobile.yml"

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --ci
